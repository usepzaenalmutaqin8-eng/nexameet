<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexaMeet</title>
<meta name="author" content="Di damel ku Usep Zaenal Mutaqin Ver.11112026">
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.8.1/dist/livekit-client.umd.min.js"></script>
<style>
:root{--pri:#2563EB;--bg:#F8FAFC;--card:#fff;--tx:#1E293B;--mut:#64748B;--dan:#DC2626;--bd:#E2E8F0}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#162033;--tx:#E2E8F0;--mut:#94A3B8;--bd:#263248}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit}
.btn{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--pri);color:#fff;font-weight:600}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.6}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 12px}
.wrap{max-width:900px;margin:0 auto;padding:20px}.logo{font-weight:800;font-size:22px;margin-bottom:20px}.logo span{color:var(--pri)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}h1{font-size:28px!important}}
h1{font-size:34px;line-height:1.15;margin:0 0 12px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.av{width:clamp(34px,36%,110px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(13px,2.4vw,32px);font-weight:700;color:#fff}
#room{position:fixed;inset:0;height:100vh;height:100dvh;background:#0B1220;color:#E2E8F0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:8px 14px;font-size:14px;background:#0F172A}
.top a{color:#93C5FD}
@media(max-width:600px){.top{font-size:12px;padding:6px 10px}}
.mid{flex:1;display:flex;min-height:0;position:relative}
#sidebox{display:contents}

/* ---- Stage: strip (audience di atas) + main (speaker/pin) + galeri berhalaman ---- */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.stripw{display:flex;align-items:stretch;gap:4px;padding:6px 6px 0;flex:none}
.stripw[hidden]{display:none}
.strip{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;height:clamp(66px,15vh,118px);min-width:0;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 auto;height:100%;aspect-ratio:16/9;scroll-snap-align:start;border-width:2px;border-radius:10px}
.sa,.pg{background:#1E293B;border:0;color:#E2E8F0;cursor:pointer;border-radius:8px;flex:none}
.sa:hover,.pg:hover{background:#334155}
.sa{width:26px;font-size:13px}
.sa:disabled,.pg:disabled{opacity:.3;cursor:default}
.main{flex:1;display:grid;gap:6px;padding:6px 8px 8px;min-height:0;min-width:0}
.gw{flex:1;display:flex;gap:4px;padding:6px 4px;min-height:0}
.grid{flex:1;display:grid;gap:6px;min-width:0;min-height:0}
.pg{width:34px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pg small{font-size:10px}.pg[hidden]{display:none}
@media(max-width:520px){.pg{width:28px}}
.stage.g .stripw,.stage.g .main{display:none}.stage:not(.g) .gw{display:none}

.tile{background:#1E293B;border-radius:12px;position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;min-width:0;border:3px solid transparent}
.tile.spk{border-color:#16A34A}
.tile video{width:100%;height:100%;object-fit:cover}
.tile.scr video{object-fit:contain;background:#000}
.tile.me video{transform:scaleX(-1)}
/* video utama tidak dipotong: tampil utuh (contain); bila hanya 1 video, kotak dipas 16:9 di tengah area */
.main .tile video{object-fit:contain;background:#000}
@supports (container-type:size){
.main{container-type:size}
.main.one .tile:not(.scr){justify-self:center;align-self:center;width:min(100cqw,calc(100cqh*16/9));height:min(100cqh,calc(100cqw*9/16))}}
.nm{position:absolute;left:8px;bottom:8px;background:#000a;padding:3px 8px;border-radius:6px;font-size:12px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.strip .nm{font-size:10px;left:4px;bottom:4px;padding:2px 5px}
.tc{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;z-index:2;transition:opacity .15s}
.tile:hover .tc{opacity:1}@media(hover:none){.tc{opacity:.85}}
.tc button{background:#000a;border:0;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:14px}
.tc button.on{background:var(--pri)}
.strip .tc .mx{display:none}.strip .tc{top:3px;right:3px}.strip .tc button{padding:2px 6px;font-size:12px}
.tile.scr .pn{display:none}

.side{width:320px;background:#0F172A;border-left:1px solid #263248;display:flex;flex-direction:column}
@media(max-width:700px){.side{position:absolute;inset:0;width:100%;z-index:5}}
.side h3{margin:0;padding:12px 14px;border-bottom:1px solid #263248;font-size:15px;display:flex;justify-content:space-between}
.side a{color:#93C5FD;margin-left:6px}
.msgs{flex:1;overflow:auto;padding:12px;font-size:14px}.msgs p{margin:0 0 10px}.msgs b{color:#93C5FD}
.side form,.pl{padding:10px}.pl{overflow:auto}.side input{background:#1E293B;color:#fff;border-color:#334155;margin:0}
.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:14px;border-bottom:1px solid #1E293B;gap:6px}
.tb{display:flex;justify-content:center;gap:6px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#000;flex-wrap:wrap}
.tb button{background:none;border:0;color:#E2E8F0;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
.tb button i{font-style:normal;font-size:20px}.tb button:hover,.tb .on{background:#1E293B}.tb .end{background:var(--dan)}
@media(max-width:600px){.tb{gap:2px;padding-left:4px;padding-right:4px}.tb button{min-width:46px;padding:5px 5px;font-size:10px}.tb button i{font-size:18px}}
@media(max-height:520px){.tb button span{display:none}.tb button{min-width:40px;padding:4px 6px}.tb{padding-top:4px;padding-bottom:4px}.top{padding:4px 10px}}
/* HP/tablet sempit: toolbar satu baris yang bisa digeser, tombol Leave/End tetap terlihat di kanan */
@media(max-width:700px){.tb{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tb::-webkit-scrollbar{display:none}.tb button{flex:none}.tb>:first-child{margin-left:auto}.tb>:last-child{margin-right:auto}.tb .end{position:sticky;right:0;box-shadow:-8px 0 8px #000}}
.menu{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#1E293B;border-radius:12px;padding:6px;z-index:9;display:flex}
.menu button{background:none;border:0;color:#fff;padding:6px 10px;cursor:pointer;font-size:24px}
.fl{position:fixed;bottom:90px;font-size:34px;animation:up 2.4s ease-out forwards;pointer-events:none;z-index:20}
@keyframes up{to{transform:translateY(-260px);opacity:0}}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:8px 16px;border-radius:10px;font-size:14px;z-index:100;max-width:90%}
.pop{position:fixed;background:#1E293B;border-radius:10px;padding:6px 0;z-index:40;min-width:240px;max-width:92vw;max-height:80vh;overflow:auto;box-shadow:0 8px 30px #0008;font-size:14px;color:#E2E8F0}
.pop .it{padding:8px 14px;cursor:pointer}.pop .it:hover{background:#334155}.pop .hd{padding:6px 14px;font-weight:700;font-size:12px;color:#94A3B8}.pop hr{border:0;border-top:1px solid #334155;margin:4px 0}
.pop .red{color:#fff;background:var(--dan);margin:4px 8px;border-radius:8px;text-align:center}
.car{min-width:20px!important;padding:6px 0!important;font-size:12px!important}
@media(max-width:600px){.car{min-width:14px!important}}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;color:#E2E8F0}.modal>div{background:#1E293B;padding:20px;border-radius:14px;max-width:90vw;line-height:1.8}
/* ---- Video & efek ---- */
#room.nomirror .tile.me video,#room.nomirror .fxpv video{transform:none}
#room.orig .tile.me video{object-fit:contain!important;background:#000}
.fxbody{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.fxpv{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:10px;flex:none;display:grid;place-items:center;font-size:13px;color:#94A3B8}
.fxpv video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fxst{font-size:11px;color:#94A3B8;text-align:center;padding:0 10px 8px;flex:none}
.fxtabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid #263248;flex:none}
.fxtabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:#94A3B8;padding:8px 4px;cursor:pointer;font-size:13px}
.fxtabs button.on{color:#fff;border-color:var(--pri)}
.fxc{padding:10px 14px;flex:1}
.fxrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px}
.fxc select{background:#1E293B;color:#fff;border:1px solid #334155;border-radius:8px;padding:6px;max-width:58%}
.fxh{font-size:12px;color:#94A3B8;margin:4px 0 0}
.sw{width:42px;height:24px;border-radius:12px;border:0;background:#475569;position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--pri)}.sw.on::after{left:21px}.sw:disabled{opacity:.4;cursor:not-allowed}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgo{aspect-ratio:16/9;border-radius:8px;border:2px solid transparent;background:#1E293B;cursor:pointer;overflow:hidden;font-size:12px;display:grid;place-items:center;color:#E2E8F0;padding:0;position:relative}
.bgo.on{border-color:var(--pri)}.bgo img{width:100%;height:100%;object-fit:cover;display:block}
.bgo span{position:absolute;left:0;right:0;bottom:0;background:#000a;font-size:10px;padding:1px 0}
/* ---- Ruang tunggu, info meeting, hide profile pictures ---- */
.cn{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:8px;font-weight:700;font-size:clamp(13px,2.2vw,26px);pointer-events:none;overflow-wrap:anywhere}
#room.hidepic .tile.nov .cn{display:grid}
#room.hidepic .tile.nov .av{display:none}
.strip .cn{font-size:12px}
.wt{background:#1E293B;border-radius:10px;padding:6px 10px;margin-bottom:10px}
.wth{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.inf{min-width:min(380px,88vw)}
.ir{display:flex;justify-content:space-between;gap:16px}
.ib{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ib .btn{padding:9px 12px;font-size:13px}
.inf input{background:#0F172A;color:#fff;border-color:#334155;margin:4px 0 0}
.inf .btn.alt{background:#334155;color:#fff;border-color:#475569}
.inf small{color:#94A3B8}
#binfo{text-decoration:none}
#room.mini{inset:auto 12px 12px auto;width:300px;height:200px;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #000a;z-index:60;cursor:pointer}
#room.mini .top,#room.mini .tb,#room.mini #sidebox,#room.mini .tc,#room.mini .stripw,#room.mini .pg{display:none}#room.mini .main{padding:0}
body.minib::after{content:"Meeting berjalan di jendela mini. Klik jendela mini untuk kembali.";position:fixed;left:0;right:0;top:40%;text-align:center;color:var(--mut);padding:20px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const {Room,RoomEvent,Track,VideoPresets}=LivekitClient;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#2563EB','#16A34A','#F59E0B','#DC2626','#7C3AED','#0891B2'];
const colr=n=>COL[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const fmt=id=>id.replace(/^(\d{3})(\d{4})(\d+)$/,'$1 $2 $3');
/* view: speaker | gallery | dynamic | multi ; pins = daftar identity yang di-pin (hanya untuk tampilan saya) */
const S={wr:false,lock:false,hidePic:false,wait:new Map(),adm:new Set(),admitted:false,sent:false,jt:0,name:'',mid:'',pass:'',host:false,chat:[],hands:{},panel:null,left:false,view:'speaker',hideSelf:false,hideNV:false,timer:true,shareOk:true,rec:false,spk:'',spkT:0,mr:null,mx:'',pins:[],page:0};
let room,tick,t0=0,raf=0,sig='',wl=null;const T=new Map();
const DEFAULT_API='https://nexameet-token.usepzaenalmutaqin092.workers.dev';
function getApi(){let a=DEFAULT_API;try{a=localStorage.getItem('nx_api')||a}catch(e){}
  if(!a){a=(prompt('Tempel URL Worker token')||'').trim();try{a&&localStorage.setItem('nx_api',a)}catch(e){}}return a}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),Math.max(3200,String(t).length*70))}
const isHost=p=>{try{return JSON.parse(p.metadata||'{}').role==='host'}catch(e){return false}};

/* ---- Link undangan: https://.../#join=ID.PASSCODE -> beranda hanya berisi nama, meeting ID, passcode (tanpa New Meeting) ---- */
function parseInvite(){const m=(location.hash||'').match(/^#join(?:=(\d*)(?:\.(\w*))?)?$/);return m?{id:m[1]||'',pass:m[2]||''}:null}
const inviteLink=()=>location.href.split('#')[0].split('?')[0]+'#join='+S.mid+'.'+S.pass;
const inviteText=()=>`Bergabung ke NexaMeet\nMeeting ID: ${fmt(S.mid)}\nPasscode: ${S.pass}\nLink (cukup isi nama): ${inviteLink()}`;
async function copyTxt(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
function home(){
  const inv=parseInvite();
  app.innerHTML=`<div class="wrap"><div class="logo">Nexa<span>Meet</span></div><div class="hero"><div>${inv?'<h1>Anda diundang bergabung.</h1><p class="mut">Isi nama Anda, lalu tekan Join Meeting. Izinkan kamera dan mikrofon saat diminta.</p>':'<h1>Rapat video untuk semua jaringan.</h1><p class="mut">Buat meeting, bagikan ID dan passcode. Peserta dari Wi-Fi, data seluler, HP, atau komputer bisa bergabung.</p>'}</div>
  <div class="card"><label>Nama Anda</label><input id="n" value="${esc(S.name)}" placeholder="Contoh: Usep">
  ${inv?'':'<button class="btn" id="nm" style="width:100%">📹 New Meeting</button><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">'}
  <label>Meeting ID</label><input id="id" inputmode="numeric" placeholder="123 4567 8901" value="${inv&&inv.id?fmt(inv.id):''}"><label>Passcode</label><input id="pc" inputmode="numeric" value="${inv?esc(inv.pass):''}">
  <button class="btn${inv?'':' alt'}" id="jn" style="width:100%">Join Meeting</button></div></div><p class="mut" style="text-align:center;font-size:13px;margin-top:28px">Di damel ku Usep Zaenal Mutaqin Ver.11112026</p></div>`;
  const go=async action=>{const n=$('#n').value.trim();if(!n)return toast('Isi nama dulu');S.name=n;
    if(action==='join'){S.mid=$('#id').value.replace(/\D/g,'');S.pass=$('#pc').value.trim();if(S.mid.length<8)return toast('Meeting ID tidak valid')}
    const b=$(action==='create'?'#nm':'#jn'),old=b.textContent;b.disabled=true;b.textContent='Menghubungkan...';
    try{await enter(action)}catch(e){toast(e.message||'Gagal terhubung');b.disabled=false;b.textContent=old}};
  if($('#nm'))$('#nm').onclick=()=>go('create');$('#jn').onclick=()=>go('join');
}
async function enter(action){
  const api=getApi();if(!api)throw new Error('URL server token belum diisi');
  let d;try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,name:S.name,room:S.mid,pass:S.pass})});d=await r.json();if(!r.ok)throw new Error(d.error||'Ditolak server')}
  catch(e){throw new Error(e.message==='Failed to fetch'?'Tidak bisa menghubungi server token':e.message)}
  S.mid=d.room;if(d.pass)S.pass=d.pass;S.host=action==='create';S.chat=[];S.hands={};S.panel=null;S.left=false;S.pins=[];S.page=0;S.mx='';S.spk='';fxReset();
  S.wr=false;S.lock=false;S.hidePic=false;S.shareOk=true;S.wait=new Map();S.adm=new Set();S.admitted=false;S.sent=false;clearTimeout(S.jt);clearInterval(S.ji);clearInterval(S.rc);S.ack=false;S.lt=0;S.shBusy=false;
  room=new Room({adaptiveStream:true,dynacast:true,videoCaptureDefaults:{resolution:VideoPresets.h360}});
  const E=RoomEvent;
  [E.ParticipantConnected,E.ParticipantDisconnected,E.TrackMuted,E.TrackUnmuted,E.TrackSubscribed,E.LocalTrackPublished,E.LocalTrackUnpublished,E.ActiveSpeakersChanged,E.ParticipantMetadataChanged,E.ParticipantNameChanged].forEach(e=>room.on(e,update));
  room.on(E.ParticipantConnected,p=>{if(!S.host&&!S.admitted)tryJoin();if(S.host&&!isHost(p))setTimeout(()=>{if(!S.left&&room&&room.remoteParticipants.has(p.identity))hostJoin(p)},1200)});
  room.on(E.ParticipantMetadataChanged,()=>{if(!S.host&&!S.admitted)tryJoin()});
  room.on(E.TrackPublished,pub=>{if(S.admitted){try{pub.setSubscribed(true)}catch(e){}}});
  /* S.adm sengaja TIDAK dikurangi di sini: saat koneksi putus-sambung (reconnect penuh) LiveKit memutus lalu menyambung ulang semua peserta,
     dan izin masuk harus tetap berlaku. Antrean tunggu & status host baru dibersihkan bila peserta tidak kembali dalam 6 detik. */
  room.on(E.ParticipantDisconnected,p=>{const id=p.identity;delete S.hands[id];
    if(S.host&&S.wait.has(id))setTimeout(()=>{if(!S.left&&room&&!room.remoteParticipants.has(id)&&S.wait.delete(id))update()},6000);
    if(!S.host&&!S.admitted&&isHost(p))setTimeout(()=>{if(!S.left&&!S.admitted&&![...room.remoteParticipants.values()].some(isHost))leave('Host meninggalkan meeting.')},6000);
    update()});
  room.on(E.TrackSubscribed,(t,pub,p)=>{if(t.kind==='audio'){const a=t.attach();a.dataset.a=p.identity;document.body.appendChild(a)}});
  room.on(E.TrackUnsubscribed,t=>{if(t.kind==='audio')t.detach().forEach(x=>x.remove());update()});
  room.on(E.Disconnected,()=>{if(!S.left)leave('Koneksi terputus',1)});
  room.on(E.ActiveSpeakersChanged,sp=>{const s=sp.find(x=>!x.isLocal);if(s&&s.identity!==S.spk&&Date.now()-S.spkT>1500){S.spk=s.identity;S.spkT=Date.now();update()}});
  room.on(E.DataReceived,onData);
  /* peserta menyambung dengan autoSubscribe:false -> setelah reconnect penuh, langganan audio/video harus dipulihkan manual */
  room.on(E.Reconnected,()=>{if(S.admitted)room.remoteParticipants.forEach(p=>p.trackPublications.forEach(pub=>{try{pub.setSubscribed(true)}catch(e){}}))});
  room.on(E.AudioPlaybackStatusChanged,()=>{if(S.admitted&&!S.left&&!room.canPlaybackAudio)audioPrompt()});
  room.on(E.LocalTrackPublished,pub=>{if(pub.source===Track.Source.Camera){FX.cur=null;applyFx();if(S.panel==='fx')setTimeout(attachPreview,300)}});
  /* host langsung masuk; peserta menyambung tanpa berlangganan audio/video dan tanpa mic/kamera sampai host mengizinkan */
  try{await room.connect(d.url,d.token,{autoSubscribe:S.host})}catch(e){try{room.disconnect()}catch(_){}throw new Error('Tidak bisa terhubung ke server video. Kemungkinan kuota LiveKit bulan ini habis, atau jaringan memblokir koneksi. ('+((e&&e.message)||'error')+')')}
  if(S.host){S.adm.add(room.localParticipant.identity);S.admitted=true;await startRoom()}
  else{waitScreen('Menghubungi host…');S.t1=Date.now();S.ack=false;S.lt=0;tryJoin(1);clearInterval(S.ji);
    S.ji=setInterval(()=>{if(S.admitted||S.left){clearInterval(S.ji);return}
      if(Date.now()-S.t1>60000){leave('Host tidak merespons. Pastikan host masih berada di dalam meeting dan koneksi internet stabil, lalu coba lagi.');return}
      if(S.ack)return;
      const here=[...room.remoteParticipants.values()].some(isHost),e=$('#wmsg');
      if(e)e.textContent=here?'Menghubungi host… (mencoba lagi)':'Menunggu host membuka meeting…';
      tryJoin(1)},2500)}
}
/* pesan error perangkat yang jelas (bukan sekadar "diblokir") */
function devErr(e,k){const n=(e&&e.name)||'',w=k==='cam'?'Kamera':'Mikrofon';
  if(k==='scr')return toast(n==='NotAllowedError'||n==='AbortError'?'Berbagi layar dibatalkan atau tidak diizinkan':'Berbagi layar gagal ('+(n||'error')+'). Coba lagi.');
  toast(n==='NotAllowedError'||n==='SecurityError'?w+' ditolak: izinkan akses '+w.toLowerCase()+' untuk situs ini di pengaturan browser'
    :n==='NotReadableError'||n==='AbortError'?w+' sedang dipakai aplikasi lain (tutup Zoom/aplikasi lain, lalu nyalakan lagi)'
    :n==='NotFoundError'||n==='OverconstrainedError'?w+' tidak ditemukan di perangkat ini':w+' tidak bisa diakses')}
/* tombol ajakan bila browser (terutama iPhone/Safari) memblokir pemutaran suara otomatis */
function audioPrompt(){if($('#aud'))return;const b=document.createElement('button');b.id='aud';b.className='toast';b.style.cssText='border:0;cursor:pointer;background:#2563EB';b.textContent='🔊 Ketuk di sini untuk mengaktifkan suara';
  b.onclick=async()=>{try{await room.startAudio()}catch(e){}b.remove()};document.body.appendChild(b)}
/* cegah layar HP mati saat meeting */
async function wakeLock(){try{if(navigator.wakeLock&&!wl&&!S.left){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&room&&S.admitted&&!S.left)wakeLock()});
async function startRoom(){
  const lp=room.localParticipant;
  try{await lp.setMicrophoneEnabled(true)}catch(e){devErr(e,'mic')}
  if(S.left)return;
  try{await lp.setCameraEnabled(true)}catch(e){devErr(e,'cam')}
  if(S.left)return;
  t0=Date.now();clearInterval(tick);
  buildRoom();wakeLock();try{Promise.resolve(room.startAudio()).catch(()=>{})}catch(e){}
  clearInterval(S.rc);S.rc=setInterval(()=>{if(!room||S.left||!S.admitted)return;room.remoteParticipants.forEach(p=>p.trackPublications.forEach(pb=>{if(!pb.isSubscribed){try{pb.setSubscribed(true)}catch(e){}}}))},4000);
  tick=setInterval(()=>{const e=$('#clk');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000);
}
/* send tanpa tujuan = hanya ke peserta yang sudah diizinkan masuk; peserta di ruang tunggu tidak menerima chat/pesan lain */
function pub(m,dest){if(!dest.length)return Promise.resolve();return room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(m)),{reliable:true,destinationIdentities:dest}).catch(()=>{})}
const send=(m,to)=>pub(m,to?[to]:[...S.adm].filter(id=>id!==room.localParticipant.identity&&room.remoteParticipants.has(id)));
const sendAll=m=>pub(m,[...room.remoteParticipants.keys()]);
function onData(buf,p){let d;try{d=JSON.parse(new TextDecoder().decode(buf))}catch(e){return}if(!p)return;
  const me=room.localParticipant.identity;
  if(d.t==='join'){hostJoin(p);return}
  if(isHost(p)&&(d.t==='wait'||d.t==='admit'||d.t==='deny'||d.t==='state')){hostMsg(d);return}
  if(!shown(p))return;
  if(d.t==='chat'){const m=String(d.m).slice(0,500);const n=p.name+(d.dm?' (pribadi)':'');S.chat.push({n,m});if(S.panel==='chat')addMsg(n,m);else toast(n+': '+m)}
  else if(d.t==='rx')fly(String(d.e).slice(0,4));
  else if(d.t==='hand'){S.hands[p.identity]=!!d.v;update()}
  else if(d.t==='cmd'&&isHost(p)){
    if(d.c==='end')leave('Host mengakhiri meeting',1);
    else if(d.c==='kick'&&d.to===me)leave('Anda dikeluarkan oleh host',1);
    else if(d.c==='shareok'){S.shareOk=!!d.v;if(!d.v&&room.localParticipant.isScreenShareEnabled)room.localParticipant.setScreenShareEnabled(false);toast(d.v?'Host mengizinkan berbagi layar':'Berbagi layar dinonaktifkan oleh host')}
    else if(d.c==='mute'&&(!d.to||d.to===me)&&!S.host){room.localParticipant.setMicrophoneEnabled(false);toast('Host mematikan mikrofon Anda')}}}

/* ---- Ruang tunggu / kunci meeting / admit ----
   Dijalankan di sisi aplikasi lewat pesan data LiveKit. Peserta yang menunggu tidak berlangganan audio/video
   dan tidak menerima chat; ini bukan pengganti penegakan di server token. */
const shown=p=>!room||p===room.localParticipant||isHost(p)||S.adm.has(p.identity);
const rlist=()=>[...room.remoteParticipants.values()].filter(shown);
const plist=()=>[room.localParticipant,...rlist()];
function bstate(){if(!S.host||!room)return;send({t:'state',adm:[...S.adm],wr:S.wr?1:0,lock:S.lock?1:0,hp:S.hidePic?1:0,so:S.shareOk?1:0})}
function tryJoin(f){if(S.host||S.admitted||S.left||!room)return;if(!f&&Date.now()-(S.lt||0)<1500)return;const h=[...room.remoteParticipants.values()].find(isHost);if(h){S.lt=Date.now();send({t:'join'},h.identity)}}
function hostJoin(p){
  if(!S.host)return;const id=p.identity,nm=p.name||'Peserta';
  if(S.adm.has(id)){send({t:'admit'},id);bstate();return}
  if(S.wait.has(id)){send({t:'wait'},id);return}
  if(S.lock){send({t:'deny',c:'lock'},id);return}
  if(S.wr){S.wait.set(id,nm);send({t:'wait'},id);toast(nm+' menunggu di ruang tunggu');update()}
  else{doAdmit(id);toast(nm+' bergabung');update()}}
function doAdmit(id,quiet){S.wait.delete(id);S.adm.add(id);send({t:'admit'},id);if(!quiet)bstate()}
function admit(id){if(!S.wait.has(id))return;const nm=S.wait.get(id);doAdmit(id);toast(nm+' diizinkan masuk');update()}
function admitAll(){const ids=[...S.wait.keys()];if(!ids.length)return toast('Ruang tunggu kosong');ids.forEach(id=>doAdmit(id,1));bstate();toast(ids.length+' peserta diizinkan masuk');update()}
function reject(id){if(!S.wait.has(id))return;S.wait.delete(id);send({t:'deny',c:'rej'},id);update()}
function waitScreen(msg){app.innerHTML=`<div class="wrap" style="max-width:520px;text-align:center"><div class="logo">Nexa<span>Meet</span></div><div class="card"><h2>Ruang tunggu</h2><p class="mut" id="wmsg">${esc(msg)}</p><p class="mut" style="font-size:13px">Meeting ID ${esc(fmt(S.mid))}</p><button class="btn alt" id="wx">Batal</button></div></div>`;$('#wx').onclick=()=>leave('Anda keluar dari ruang tunggu')}
function hostMsg(d){
  if(S.host)return;
  if(d.t==='wait'){S.ack=true;clearTimeout(S.jt);const e=$('#wmsg');if(e)e.textContent='Menunggu host mengizinkan Anda masuk…'}
  else if(d.t==='deny')leave(d.c==='lock'?'Meeting ini sedang dikunci oleh host.':'Host tidak mengizinkan Anda masuk.');
  else if(d.t==='admit')onAdmitted();
  else if(d.t==='state')applyState(d)}
async function onAdmitted(){
  if(S.admitted||S.left)return;S.admitted=true;clearTimeout(S.jt);clearInterval(S.ji);
  room.remoteParticipants.forEach(p=>p.trackPublications.forEach(pub=>{try{pub.setSubscribed(true)}catch(e){}}));
  await startRoom()}
function applyState(d){
  const old=S.adm,me=room.localParticipant.identity;S.adm=new Set((d.adm||[]).map(String));
  S.wr=!!d.wr;S.lock=!!d.lock;S.hidePic=!!d.hp;if(d.so!==undefined)S.shareOk=!!d.so;
  if(old.size){const add=[...S.adm].filter(id=>!old.has(id)&&id!==me);
    add.forEach(id=>{const p=room.remoteParticipants.get(id);if(p&&!isHost(p))toast((p.name||'Peserta')+' bergabung')});
    if(add.length&&S.hands[me])send({t:'hand',v:1})}
  update()}
function hostAct(a){
  if(a==='wr'){S.wr=!S.wr;bstate();toast(S.wr?'Ruang tunggu aktif: peserta baru menunggu persetujuan Anda':'Ruang tunggu dinonaktifkan');return true}
  if(a==='lock'){S.lock=!S.lock;bstate();toast(S.lock?'Meeting dikunci: peserta baru tidak bisa masuk':'Meeting dibuka kembali');return true}
  if(a==='hp'){S.hidePic=!S.hidePic;bstate();toast(S.hidePic?'Foto profil disembunyikan':'Foto profil ditampilkan');return true}
  if(a==='waitp'){if(S.panel!=='part')openPanel('part');return true}
  if(a==='admitall'){admitAll();return true}
  return false}

/* ---- Tampilan: dibangun sekali, lalu hanya diperbarui sebagian (elemen video dipindah, tidak dibuat ulang) ---- */

   +(S.pins.length?it('unpinall','','Lepas semua pin ('+S.pins.length+')'):'')
   +it('hs','','Sembunyikan tampilan saya',S.hideSelf)+it('hn','','Sembunyikan peserta tanpa video',S.hideNV)+'<hr>'+it('tm','','Tampilkan timer meeting',S.timer)+it('fs','','Layar penuh')}
function buildRoom(){
  const b=(id,l)=>`<button id="${id}"><i></i><span>${l}</span></button>`,car=id=>`<button class="car" id="${id}">▴</button>`;
  app.innerHTML=`<div id="room"><div class="top"><span><a href="#" id="binfo" title="Info meeting">🛡️ NexaMeet</a></span><span><b id="recb" hidden style="color:#F87171">● REC </b><a href="#" id="bpip">— Minimize</a> · <a href="#" id="bview">⊞ Tampilan</a> · <span id="clk">00:00</span></span></div>
  <div class="mid"><div class="stage" id="stage">

  T.clear();S.panel=null;sig='';
  const lp=()=>room.localParticipant,f=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=ev=>{ev.preventDefault();fn()}};
  const tog=async(fn,k)=>{try{await fn()}catch(e){devErr(e,k)}update()};
  f('bm',()=>tog(()=>lp().setMicrophoneEnabled(!lp().isMicrophoneEnabled),'mic'));
  f('bv',()=>tog(()=>lp().setCameraEnabled(!lp().isCameraEnabled),'cam'));
  f('bs',()=>{if(!S.host&&!S.shareOk&&!lp().isScreenShareEnabled)return toast('Host tidak mengizinkan berbagi layar');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return toast('Berbagi layar tidak didukung di perangkat/browser ini (umumnya hanya tersedia di laptop/PC)');
    shareToggle()});
  f('bp',()=>openPanel('part'));f('bc',()=>openPanel('chat'));
  f('br',()=>{const m=$('#menubox');m.innerHTML=m.innerHTML?'':`<div class="menu">${['👍','👏','❤️','😂','🎉'].map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`});
  f('bh',()=>{const id=lp().identity,v=!S.hands[id];S.hands[id]=v;send({t:'hand',v:v?1:0});update()});
  f('bview',()=>pop('bview',viewHtml(),true));
  f('bvw',()=>pop('bvw',viewHtml()));
  f('cm',async()=>pop('cm',await devs('audioinput','Pilih mikrofon')+'<hr>'+await devs('audiooutput','Pilih speaker')));
  f('cv',async()=>pop('cv',await devs('videoinput','Pilih kamera')+'<hr>'+it('blur','','Blur latar belakang',FX.bg==='blur')+it('fxbg','','Latar belakang virtual…',FX.bg==='img')+'<hr>'+it('touch','','Perbaiki penampilan',FX.touch)+it('low','','Sesuaikan cahaya redup',FX.low)+'<hr>'+it('hd','','HD (720p)',FX.hd)+it('orig','','Rasio asli',FX.orig)+it('mirror','','Cermin video saya',FX.mirror)+'<hr>'+it('fxpanel','','Pengaturan video & efek…')));
  f('bpip',()=>pip());
  f('sl',()=>{const s=$('#strip');s.scrollBy({left:-s.clientWidth*.8,behavior:'smooth'})});
  f('sr',()=>{const s=$('#strip');s.scrollBy({left:s.clientWidth*.8,behavior:'smooth'})});
  f('pl',()=>goPage(-1));f('pr',()=>goPage(1));
  const st=$('#strip');st.addEventListener('scroll',stripArrows,{passive:true});
  st.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){st.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  let tx=0;const gw=$('#gw');gw.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  gw.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)goPage(dx<0?1:-1)},{passive:true});
  $('#room').addEventListener('click',e=>{if($('#room').classList.contains('mini')&&!e.target.closest('.top,.tb'))setMini(false)});
  f('bk',()=>pop('bk',`<div class="hd">Host tools</div>`+it('wr','','Aktifkan ruang tunggu',S.wr)+it('lock','','Kunci meeting',S.lock)+it('hp','','Sembunyikan foto profil',S.hidePic)+'<hr>'+it('waitp','','Peserta menunggu ('+S.wait.size+')…')+(S.wait.size?it('admitall','','Izinkan semua masuk'):'')+'<hr>'+it('mall','','Mute semua peserta')+it('sok','','Izinkan peserta berbagi layar',S.shareOk)));
  f('bmo',()=>pop('bmo',it('fxpanel','','Video & efek')+it('rec','',S.rec?'Stop recording':'Record (rekam tab ini)')+it('info','','Info meeting')+it('fs','','Layar penuh')));
  f('be',()=>pop('be',(S.host?`<div class="it red" data-a="endall">Akhiri meeting untuk semua</div>`:'')+`<div class="it${S.host?'':' red'}" data-a="leave">Tinggalkan meeting</div><div class="it" data-a="x">Batal</div>`));
  f('binfo',()=>info());
  $('#menubox').onclick=e=>{const x=e.target.closest('[data-e]');if(!x)return;send({t:'rx',e:x.dataset.e});fly(x.dataset.e);$('#menubox').innerHTML=''};
  $('#sidebox').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();
    if(a.dataset.x)openPanel(null);else if(a.dataset.m)send({t:'cmd',c:'mute',to:a.dataset.m});else if(a.dataset.k)send({t:'cmd',c:'kick',to:a.dataset.k});else if(a.dataset.p)togglePin(a.dataset.p);else if(a.dataset.ad)admit(a.dataset.ad);else if(a.dataset.rj)reject(a.dataset.rj);else if(a.dataset.aa)admitAll()};
  update();
}
function update(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!room||S.left||!$('#grid'))return;syncTiles();syncBar();syncSide()})}
function goPage(d){S.page=Math.max(0,S.page+d);update()}
function togglePin(id){
  const i=S.pins.indexOf(id);
  if(i>=0){S.pins.splice(i,1);toast('Pin dilepas')}
  else{if(S.pins.length>=4)S.pins.shift();S.pins.push(id);
    if(S.view==='gallery'||S.view==='dynamic'){S.view='speaker';toast('Peserta di-pin — beralih ke tampilan Speaker')}else toast('Peserta di-pin')}
  S.mx='';update()}
function tileFor(k,cls,pid){let t=T.get(k);if(!t){const el=document.createElement('div');el.className='tile '+cls;
  el.innerHTML='<span class="nm"></span><span class="cn"></span><div class="tc"><button class="pn" title="Pin / Lepas pin">📌</button><button class="mx" title="Maximize / Restore">⛶</button></div>';
  const t0={el,nm:el.querySelector('.nm'),cn:el.querySelector('.cn'),pnb:el.querySelector('.pn'),mxb:el.querySelector('.mx'),media:null,tr:null,an:'',pid};
  el.ondblclick=()=>{S.mx=S.mx===k?'':k;update()};
  t0.mxb.onclick=ev=>{ev.stopPropagation();S.mx=S.mx===k?'':k;update()};
  t0.pnb.onclick=ev=>{ev.stopPropagation();togglePin(pid)};
  T.set(k,t0);t=t0}return t}
function dropMedia(t){if(t.media){try{t.tr&&t.tr.detach(t.media)}catch(e){}t.media.remove()}t.media=null;t.tr=null;t.an=''}
function setMedia(t,pub,name){
  const tr=pub&&pub.track&&!pub.isMuted?pub.track:null;
  if(tr){
    if(!t.tr||t.tr!==tr||!t.media||t.media.tagName!=='VIDEO'){dropMedia(t);const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;t.el.insertBefore(v,t.nm);tr.attach(v);t.media=v;t.tr=tr}
  }else if(name!==null){
    if(t.tr||!t.media){dropMedia(t);const a=document.createElement('div');a.className='av';t.el.insertBefore(a,t.nm);t.media=a}
    if(t.an!==name){t.an=name;t.media.textContent=ini(name);t.media.style.background=colr(name)}
  }
  t.el.classList.toggle('nov',!!t.media&&t.media.tagName!=='VIDEO');
}
/* menempatkan tile ke container sesuai urutan; elemen yang pindah diputar ulang agar video tidak berhenti */
function place(par,keys){
  keys.forEach((k,i)=>{const el=T.get(k).el;
    if(par.children[i]!==el){const moved=el.parentNode!==par;par.insertBefore(el,par.children[i]||null);
      if(moved){const v=el.querySelector('video');if(v)v.play().catch(()=>{})}}});
  while(par.children.length>keys.length)par.lastElementChild.remove()}
function dims(){const w=innerWidth,h=innerHeight;let c=w<520?2:w<900?3:5,r=h<520?2:(w<520?3:(h<760?3:4));if(w>=1200&&h>=800){c=5;r=5}return[c,r]}
function pickGrid(n,W,H,mc,mr){if(n<=0)return[1,1];let best=[mc,mr],bs=1e9;
  for(let c=1;c<=Math.min(mc,n);c++){const r=Math.ceil(n/c);if(r>mr)continue;const a=(W/c)/(H/r),s=Math.abs(Math.log(a/1.6));if(s<bs){bs=s;best=[c,r]}}return best}
function stripArrows(){const w=$('#stripw'),s=$('#strip');if(!s||!w||w.hidden)return;const l=$('#sl'),r=$('#sr'),can=s.scrollWidth>s.clientWidth+2;
  l.style.visibility=r.style.visibility=can?'visible':'hidden';l.disabled=s.scrollLeft<=1;r.disabled=s.scrollLeft+s.clientWidth>=s.scrollWidth-1}
function syncTiles(){
  const lp=room.localParticipant,ps=plist(),keep=new Set();
  const host=ps.find(isHost)||null,remotes=ps.filter(p=>p!==lp);
  const spkId=remotes.some(p=>p.identity===S.spk)?S.spk:null;
  const cams=[],scr=[];
  const ord=p=>isHost(p)?0:p===lp?1:2;
  [...ps].sort((a,b)=>ord(a)-ord(b)).forEach(p=>{const me=p===lp,nm=p.name||'Peserta',id=p.identity;
    if(p.isScreenShareEnabled){const k='s:'+id,t=tileFor(k,'scr',id);keep.add(k);setMedia(t,p.getTrackPublication(Track.Source.ScreenShare),null);t.nm.textContent='Layar '+nm;t.el.classList.remove('spk');scr.push(k)}
    if((me&&S.hideSelf)||(S.hideNV&&!p.isCameraEnabled&&!p.isScreenShareEnabled))return;
    const k='c:'+id,t=tileFor(k,me?'me':'',id),pinned=S.pins.includes(id);keep.add(k);cams.push(k);t.cn.textContent=nm;
    setMedia(t,p.isCameraEnabled?p.getTrackPublication(Track.Source.Camera):null,nm);
    t.el.classList.toggle('spk',!!p.isSpeaking);t.pnb.classList.toggle('on',pinned);
    t.nm.textContent=(pinned?'📌 ':'')+(p.isMicrophoneEnabled?'':'🔇 ')+(S.hands[id]?'✋ ':'')+nm+(me?' (Anda)':'')+(isHost(p)?' · Host':'')});
  for(const [k,t] of T)if(!keep.has(k)){dropMedia(t);t.el.remove();T.delete(k)}
  S.pins=S.pins.filter(id=>cams.includes('c:'+id));
  if(S.mx&&!T.has(S.mx))S.mx='';
  for(const [k,t] of T)t.mxb.textContent=k===S.mx?'🗗':'⛶';

  let main=[],strip=[],gal=false;
  if(S.mx){main=[S.mx]}
  else if(scr.length){main=[scr[0]];strip=cams}
  else if(S.view==='gallery'||S.view==='dynamic'){gal=true}
  else{
    let m=S.pins.map(id=>'c:'+id).slice(0,4);
    if(!m.length){
      const pick=(host&&host!==lp?host.identity:null);
      if(S.view==='multi'){
        const a=[];if(host)a.push(host.identity);if(spkId&&!a.includes(spkId))a.push(spkId);
        if(a.length<2){const o=remotes.find(p=>!a.includes(p.identity));if(o)a.push(o.identity)}
        if(a.length<2&&!a.includes(lp.identity))a.push(lp.identity);
        m=a.map(id=>'c:'+id).filter(k=>cams.includes(k)).slice(0,2);
      }else{
        const id=spkId||pick||(remotes[0]||lp).identity;m=['c:'+id].filter(k=>cams.includes(k));
      }
      if(!m.length&&cams.length)m=[cams[0]];
    }
    main=m;strip=cams.filter(k=>!main.includes(k));
  }
  const stage=$('#stage'),mainEl=$('#main'),stripEl=$('#strip'),grid=$('#grid'),sw=$('#stripw');
  stage.classList.toggle('g',gal);

  /* main */
  place(mainEl,gal?[]:main);
  mainEl.classList.toggle('one',!gal&&main.length===1);
  if(!gal){const n=main.length,w=mainEl.clientWidth||innerWidth;let c=1,r=1;

  let s={};try{s=tr.mediaStreamTrack.getSettings()}catch(_){}
  const v=FX.pv,w=(v&&v.videoWidth)||s.width||0,h=(v&&v.videoHeight)||s.height||0,fps=s.frameRate?Math.round(s.frameRate):0;
  const lb=h>=1080?'Full HD':h>=720?'HD':'standar';
  e.textContent=w?`Resolusi kamera: ${w}×${h} · ${lb}${fps?' · '+fps+' fps':''}`:'Resolusi kamera: memuat…'}
function attachPreview(){
  const box=$('#fxpv');if(!box)return;const tr=camTrack();
  if(!tr){detachPreview();box.textContent='Kamera mati';return}
  if(FX.pv&&FX.pvT&&FX.pvT!==tr){try{FX.pvT.detach(FX.pv)}catch(e){}}
  if(!FX.pv){FX.pv=document.createElement('video');FX.pv.autoplay=true;FX.pv.playsInline=true;FX.pv.muted=true}
  if(FX.pv.parentNode!==box){box.textContent='';box.appendChild(FX.pv)}
  tr.attach(FX.pv);FX.pvT=tr}
function buildFx(sb){
  sb.innerHTML=`<aside class="side"><h3>Video &amp; efek <a href="#" data-x="1">✕</a></h3><div class="fxbody"><div class="fxpv" id="fxpv"></div><div class="fxst" id="fxst"></div><div class="fxtabs" id="fxtabs"></div><div class="fxc" id="fxc"></div></div><input type="file" id="fxup" accept="image/*" hidden></aside>`;
  const as=sb.firstChild;
  as.onclick=async e=>{const b=e.target.closest('[data-t],[data-fx],[data-bg]');if(!b||b.disabled)return;
    if(b.dataset.t){FX.tab=b.dataset.t;renderFx()}
    else if(b.dataset.fx)await act(b.dataset.fx)
    else if(b.dataset.bg)pickBg(b.dataset.bg)};
  as.onchange=e=>{const t=e.target;if(t.id==='fxcam')act('dev','videoinput|'+t.value);else if(t.id==='fxup'&&t.files[0]){loadUpload(t.files[0]);t.value=''}};
  renderFx();attachPreview();fxStat();FX.st=setInterval(fxStat,1000)}
function renderFx(){
  const tabs=$('#fxtabs'),c=$('#fxc');if(!tabs||!c)return;
  tabs.innerHTML=[['video','Video'],['look','Penampilan'],['bg','Latar belakang']].map(([k,l])=>`<button data-t="${k}" class="${FX.tab===k?'on':''}">${l}</button>`).join('');
  const sw=(n,on,dis)=>`<button class="sw${on?' on':''}" data-fx="${n}"${dis?' disabled':''} aria-pressed="${!!on}"></button>`;
  let h='';
  if(FX.tab==='video')h=`<div class="fxrow"><span>Kamera</span><select id="fxcam"></select></div><div class="fxrow"><span>HD (720p)</span>${sw('hd',FX.hd)}</div><div class="fxrow"><span>Rasio asli</span>${sw('orig',FX.orig)}</div><div class="fxrow"><span>Cermin video saya</span>${sw('mirror',FX.mirror)}</div>`;
  else if(FX.tab==='look'){const dis=FX.bg!=='none'||!FXOK;
    h=`<div class="fxrow"><span>Perbaiki penampilan</span>${sw('touch',FX.touch,dis)}</div><div class="fxrow"><span>Sesuaikan cahaya redup</span>${sw('low',FX.low,dis)}</div><p class="fxh">${!FXOK?'Browser ini belum mendukung efek ini.':FX.bg!=='none'?'Nonaktif saat latar belakang blur/virtual dipakai.':'Efek ringan: melembutkan gambar dan mencerahkan video. Terlihat juga oleh peserta lain.'}</p>`}
  else{const P=mkPresets(),on=(k)=>(k==='none'&&FX.bg==='none')||(k==='blur'&&FX.bg==='blur'&&FX.blur===10)||(k==='blur2'&&FX.bg==='blur'&&FX.blur===22);
    h='<div class="bgs">'+[['none','Tanpa'],['blur','Blur'],['blur2','Blur kuat']].map(([k,l])=>`<button class="bgo${on(k)?' on':''}" data-bg="${k}">${l}</button>`).join('')
     +P.map((p,i)=>`<button class="bgo${FX.bg==='img'&&FX.img===p.url?' on':''}" data-bg="p${i}" title="${esc(p.name)}"><img src="${p.url}" alt=""><span>${esc(p.name)}</span></button>`).join('')
     +FX.imgs.map((u,i)=>`<button class="bgo${FX.bg==='img'&&FX.img===u?' on':''}" data-bg="u${i}"><img src="${u}" alt=""><span>Gambar saya</span></button>`).join('')
     +'<button class="bgo" data-bg="up">+ Unggah</button></div><p class="fxh">Efek background butuh browser modern dan unduhan model pertama kali.</p>'}
  c.innerHTML=h;if(FX.tab==='video')fillCams()}
async function fillCams(){
  const s=$('#fxcam');if(!s)return;let ds=[],cur='';
  try{ds=await Room.getLocalDevices('videoinput')}catch(e){}try{cur=room.getActiveDevice('videoinput')}catch(e){}
  s.innerHTML=ds.map(d=>`<option value="${esc(d.deviceId)}"${d.deviceId===cur?' selected':''}>${esc(d.label||'Kamera')}</option>`).join('')||'<option>Tidak tersedia</option>'}
function pickBg(k){
  if(k==='none')FX.bg='none';
  else if(k==='blur'||k==='blur2'){FX.bg='blur';FX.blur=k==='blur'?10:22}
  else if(k==='up'){$('#fxup').click();return}
  else{const u=k[0]==='p'?(mkPresets()[+k.slice(1)]||{}).url:FX.imgs[+k.slice(1)];if(!u)return;FX.bg='img';FX.img=u}
  if(!camTrack()&&FX.bg!=='none')toast('Nyalakan kamera untuk melihat efek background');
  applyFx();renderFx()}
function loadUpload(file){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,1280/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.85);
      FX.imgs.push(u);if(FX.imgs.length>3)FX.imgs.shift();FX.bg='img';FX.img=u;applyFx();renderFx()};
    im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=r.result};
  r.readAsDataURL(file)}

/* link undangan dibuka/diganti saat halaman beranda sedang terbuka: tampilkan ulang beranda sesuai mode */
addEventListener('hashchange',()=>{if(!$('#jn'))return;const n=$('#n');if(n)S.name=n.value.trim();home()});
/* responsif: hitung ulang tata letak saat layar diputar / ukuran berubah; panah keyboard untuk pindah halaman galeri */
addEventListener('resize',()=>update());addEventListener('orientationchange',()=>setTimeout(update,200));
addEventListener('keydown',e=>{const st=$('#stage');if(!room||S.left||!st||!st.classList.contains('g'))return;
  if(/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;
  if(e.key==='ArrowLeft')goPage(-1);else if(e.key==='ArrowRight')goPage(1)});
home();
</script></body></html>
